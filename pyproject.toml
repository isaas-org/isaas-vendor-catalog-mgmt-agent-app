[project]
name = "isaas-vendor-catalog-agent"
version = "0.1.0"
description = "MCP server that lets agents manage iSaaS catalog listings on behalf of vendors"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "mcp>=2.3,<3",
]

[project.scripts]
isaas-vendor-catalog-agent = "isaas_vendor_catalog_agent.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
